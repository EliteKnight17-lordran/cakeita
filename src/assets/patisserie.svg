<svg xmlns="http://www.w3.org/2000/svg" width="360" height="360" viewBox="0 0 360 360">
  <!-- Pâtisserie line drawings for the page background: one color, very light, so text stays AA. -->
  <g fill="none" stroke="#8c2246" stroke-opacity="0.11" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <!-- slice of layer cake -->
    <g transform="translate(26 34) rotate(-8)">
      <path d="M0 42 L52 22 L52 54 L0 70 Z"/>
      <path d="M0 52 L52 34 M0 61 L52 44"/>
      <path d="M0 42 C10 34 30 24 52 22"/>
      <circle cx="34" cy="16" r="5"/>
      <path d="M34 11 q3 -7 9 -8"/>
    </g>
    <!-- cupcake -->
    <g transform="translate(212 22)">
      <path d="M8 34 L14 64 L44 64 L50 34"/>
      <path d="M19 34 L21 64 M29 34 L29 64 M39 34 L37 64"/>
      <path d="M4 34 C2 20 14 12 22 14 C24 6 36 4 40 12 C50 12 56 24 54 34 Z"/>
      <circle cx="29" cy="5" r="3.5"/>
    </g>
    <!-- whisk -->
    <g transform="translate(140 118) rotate(28)">
      <path d="M0 0 L0 30"/>
      <path d="M0 30 C-16 44 -14 78 0 84 C14 78 16 44 0 30"/>
      <path d="M0 30 C-7 46 -6 74 0 84 C6 74 7 46 0 30"/>
      <rect x="-4" y="-22" width="8" height="22" rx="4"/>
    </g>
    <!-- macaron -->
    <g transform="translate(260 156)">
      <path d="M0 18 C0 6 56 6 56 18 Z"/>
      <path d="M2 22 C10 26 46 26 54 22"/>
      <path d="M0 28 C0 40 56 40 56 28 Z"/>
    </g>
    <!-- cherry -->
    <g transform="translate(46 214)">
      <circle cx="12" cy="40" r="11"/>
      <circle cx="36" cy="44" r="10"/>
      <path d="M12 29 C14 14 22 6 32 2 M36 34 C34 20 32 10 32 2"/>
      <path d="M32 2 C40 -2 48 2 50 8 C42 10 36 8 32 2"/>
    </g>
    <!-- two-tier cake with a candle -->
    <g transform="translate(170 250)">
      <rect x="0" y="34" width="70" height="30" rx="4"/>
      <rect x="14" y="10" width="42" height="24" rx="4"/>
      <path d="M0 44 C8 50 14 40 22 46 C30 52 36 40 46 46 C54 52 62 40 70 46"/>
      <path d="M35 10 V-4"/>
      <path d="M35 -8 q4 -6 0 -12 q-4 6 0 12"/>
      <path d="M-8 64 H78"/>
    </g>
    <!-- croissant -->
    <g transform="translate(276 270) rotate(-14)">
      <path d="M0 22 C6 6 46 6 52 22 C44 30 8 30 0 22 Z"/>
      <path d="M14 10 L18 26 M26 8 L26 28 M38 10 L34 26"/>
    </g>
  </g>
  <!-- tiny sparkles -->
  <g fill="#a8834a" fill-opacity="0.22">
    <path d="M120 40 l3 9 9 3 -9 3 -3 9 -3 -9 -9 -3 9 -3 Z"/>
    <path d="M330 110 l2 6 6 2 -6 2 -2 6 -2 -6 -6 -2 6 -2 Z"/>
    <path d="M24 150 l2 6 6 2 -6 2 -2 6 -2 -6 -6 -2 6 -2 Z"/>
    <path d="M128 330 l3 8 8 3 -8 3 -3 8 -3 -8 -8 -3 8 -3 Z"/>
  </g>
  <g fill="#8c2246" fill-opacity="0.10">
    <rect x="98" y="196" width="12" height="4" rx="2" transform="rotate(30 104 198)"/>
    <rect x="236" y="120" width="12" height="4" rx="2" transform="rotate(-40 242 122)"/>
    <rect x="320" y="226" width="12" height="4" rx="2" transform="rotate(70 326 228)"/>
    <rect x="70" y="112" width="12" height="4" rx="2" transform="rotate(-15 76 114)"/>
  </g>
</svg>
